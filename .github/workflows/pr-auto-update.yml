name: PR auto-update

# main requires PRs to be up to date before merging (strict), so an auto-merge
# PR stalls as soon as main moves until someone clicks "Update branch". After
# every push to main (and on a short schedule as a fallback) this merges main
# into each open, same-repository PR that has auto-merge armed and is BEHIND.
# The update uses the hermes-release-bot App token: a branch update pushed with
# GITHUB_TOKEN would not trigger the PR's CI, so auto-merge would never fire.
# It never force-pushes (the update-branch API only adds a merge commit, bound
# to the head SHA we saw), never touches fork PRs, and skips conflicting PRs.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # One sweep at a time; a queued sweep supersedes an older queued one.
  group: pr-auto-update
  cancel-in-progress: false

jobs:
  update:
    name: Update auto-merge PRs that are behind main
    if: github.repository == 'mekenthompson/hermes-fleet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Mint a release bot token scoped to hermes-fleet
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # GitHub accepts the numeric App ID as the JWT issuer wherever a client ID is expected.
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: mekenthompson
          repositories: hermes-fleet
          permission-contents: write
          permission-pull-requests: write
          # Lets update-branch merge main into a PR when that brings in .github/workflows changes.
          permission-workflows: write

      - name: Update behind auto-merge PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          list_prs() {
            gh pr list -R "$REPO" --state open --base main --limit 100 \
              --json number,isCrossRepository,isDraft,autoMergeRequest,mergeStateStatus,mergeable,headRefOid \
              --jq '.[] | select(.autoMergeRequest != null and (.isCrossRepository | not) and (.isDraft | not))
                    | [.number, .mergeStateStatus, .mergeable, .headRefOid] | @tsv'
          }
          # GitHub computes merge state lazily, so a sweep that starts right
          # after a push to main often reads UNKNOWN. Re-read a few times
          # (bounded) before acting, so the push trigger isn't wasted and the
          # PR doesn't wait for the cron fallback.
          prs="$(list_prs)"
          for attempt in 1 2 3 4; do
            if ! printf '%s\n' "$prs" | awk -F'\t' '$2 == "UNKNOWN" { found = 1 } END { exit !found }'; then
              break
            fi
            echo "Merge state still UNKNOWN for some PRs; re-reading in 15s (attempt $attempt/4)."
            sleep 15
            prs="$(list_prs)"
          done
          if [ -z "$prs" ]; then
            echo "No open same-repository auto-merge PRs."
            exit 0
          fi
          updated=0; skipped=0; failed=0
          while IFS=$'\t' read -r number state mergeable head; do
            if [ "$mergeable" = "CONFLICTING" ] || [ "$state" = "DIRTY" ]; then
              echo "::warning title=PR auto-update skipped::#$number conflicts with main; resolve it by hand."
              echo "- #$number: conflicts with main, skipped" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            if [ "$state" != "BEHIND" ]; then
              echo "#$number is $state; nothing to do."
              continue
            fi
            # Default update method is a merge of main into the head; never a rebase or force.
            if gh api -X PUT "repos/$REPO/pulls/$number/update-branch" \
                -f expected_head_sha="$head" >/dev/null; then
              echo "#$number updated with main."
              echo "- #$number: updated with main" >> "$GITHUB_STEP_SUMMARY"
              updated=$((updated + 1))
            else
              echo "::warning title=PR auto-update failed::#$number could not be updated (its head may have moved); it will be retried on the next sweep."
              echo "- #$number: update failed, will retry" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
            fi
          done <<< "$prs"
          echo "Updated $updated, skipped $skipped conflicting, failed $failed."
