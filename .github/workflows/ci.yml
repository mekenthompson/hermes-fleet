name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Unit tests
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/source-tests"
          "$RUNNER_TEMP/source-tests/bin/python" -m pip install --require-hashes -r release/spdx-validation-requirements.txt
          . "$RUNNER_TEMP/source-tests/bin/activate"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compose syntax
        env:
          HERMES_FLEET_IMAGE: ghcr.io/example/hermes-fleet@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: python3 scripts/compose.py config -q
      - name: Immutable reference guards
        run: |
          python3 scripts/build-fleet-image.py \
            --agent-image ghcr.io/example/hermes-agent@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            --tag hermes-fleet:test \
            --dry-run
          ! python3 scripts/build-fleet-image.py \
            --agent-image ghcr.io/example/hermes-agent:latest \
            --tag hermes-fleet:test \
            --dry-run
      - name: Public tree policy
        run: python3 scripts/verify-public-tree.py
      - name: Read pinned Agent revision
        id: agent
        run: |
          python3 scripts/read-agent-image-manifest.py \
            --manifest release/agent-image-manifest.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: mekenthompson/hermes-agent
          ref: ${{ steps.agent.outputs.AGENT_REVISION }}
          path: agent-source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.7'
      - name: Real Agent Kanban scenarios
        env:
          HERMES_AGENT_SRC: ${{ github.workspace }}/agent-source
        run: |
          python -m venv "$RUNNER_TEMP/linear-scenarios"
          "$RUNNER_TEMP/linear-scenarios/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r release/linear-scenario-requirements.txt
          "$RUNNER_TEMP/linear-scenarios/bin/python" scripts/run-linear-scenarios.py \
            --agent-source "$HERMES_AGENT_SRC"
      - name: Real Agent Claude ACP context resolution
        env:
          HERMES_AGENT_SRC: ${{ github.workspace }}/agent-source
        run: |
          "$RUNNER_TEMP/linear-scenarios/bin/python" -m unittest discover \
            -s tests -p 'test_claude_acp_context.py' -v
      - name: Guarded native origin evidence
        run: |
          python3 -I -S scripts/check-linear-origin-guard.py
          "$RUNNER_TEMP/linear-scenarios/bin/python" -I scripts/run-linear-origin-scenarios.py \
            --agent-source "$GITHUB_WORKSPACE/agent-source"
      # Test-only source fixture for the retained-notification contract. This
      # does not change release/agent-image-manifest.json or deployed Core pins.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: mekenthompson/hermes-agent
          ref: 1436af4a930a65faff42cf2d79a88b65b69a5fdc
          path: agent-notification-contract
          persist-credentials: false
          fetch-depth: 1
      - name: Guarded native notification delivery contract
        run: |
          "$RUNNER_TEMP/linear-scenarios/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r tests/native-input-requirements.txt
          "$RUNNER_TEMP/linear-scenarios/bin/python" -I scripts/run-linear-input-scenarios.py \
            --agent-source "$GITHUB_WORKSPACE/agent-notification-contract" \
            --expected-revision 1436af4a930a65faff42cf2d79a88b65b69a5fdc
      # Test-only companion source. The release manifest lane above remains the
      # only release compatibility claim; this checkout proves the candidate pair.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: mekenthompson/hermes-agent
          ref: 6d019deb88645ff47beea14694b1d97cdb058bb3
          path: agent-candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Exact companion Core candidate scenarios
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          candidate = dict(json.loads(Path('release/agent-image-manifest.json').read_text()))
          candidate['revision'] = '6d019deb88645ff47beea14694b1d97cdb058bb3'
          Path(os.environ['RUNNER_TEMP'], 'hf578-candidate-test-only.json').write_text(json.dumps(candidate))
          PY
          echo 'Candidate evidence only: temporary revision selector is not a release manifest.'
          "$RUNNER_TEMP/linear-scenarios/bin/python" scripts/run-linear-scenarios.py \
            --agent-source "$GITHUB_WORKSPACE/agent-candidate" \
            --manifest "$RUNNER_TEMP/hf578-candidate-test-only.json"
          "$RUNNER_TEMP/linear-scenarios/bin/python" scripts/run-linear-scenarios.py \
            --agent-source "$GITHUB_WORKSPACE/agent-candidate" \
            --manifest "$RUNNER_TEMP/hf578-candidate-test-only.json" \
            --pattern candidate_hf578.py
      - name: Exact companion Core checkpoint and origin tests
        run: |
          (cd agent-candidate && python -m pm.build_env --source . \
            --out "$RUNNER_TEMP/hf578-core-test-env" --group dev --group test --extra all --ci)
          (cd agent-candidate && HERMES_PYTHON="$RUNNER_TEMP/hf578-core-test-env/bin/python" \
            scripts/run_tests.sh tests/hermes_cli/test_kanban_human_checkpoint.py \
            tests/gateway/test_kanban_checkpoint_local.py \
            tests/tui_gateway/test_kanban_checkpoint_passive.py \
            tests/tools/test_kanban_trusted_profile_origin.py -j 2 --file-retries 0)

  history-root:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          # tests.test_public_product.PublicProductTests.test_repository_has_no_remote_and_clean_history_contract
          # uses `git rev-list --max-parents=0`, which a shallow clone would misreport.
          fetch-depth: 0
      - name: Clean-history root
        run: python3 -m unittest tests.test_public_product.PublicProductTests.test_repository_has_no_remote_and_clean_history_contract -v
