name: Release Handoff

# Cross-repository handoff after a successful public Fleet publication on main.
#
# This workflow never builds or publishes anything. Under workflow_run the
# workflow file and the default commit context come from main's current HEAD,
# not from the published commit, so it only consumes the triggering run's own
# handoff artifact, addressed by that run's id and head_sha, and hands it to
# hermes-fleet-private's release conductor, which opens (or finds) the Stage A
# PR through the GitHub contents API and arms squash auto-merge. It is the only
# workflow in this repository that touches the release bot's private key;
# fleet-image.yml keeps the registry-write grant and no secret reference.

on:
  workflow_run:
    workflows: ["Fleet Image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Stage A PRs are opened one at a time so two publications never race on the
  # private repository; a queued handoff is never cancelled.
  group: release-handoff-stage-a
  cancel-in-progress: false

jobs:
  stage-a:
    name: Open private Stage A PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.repository == 'mekenthompson/hermes-fleet'
    permissions:
      actions: read
      contents: read
    env:
      FLEET_SHA: ${{ github.event.workflow_run.head_sha }}
      HANDOFF_ARTIFACT: fleet-image-handoff-${{ github.event.workflow_run.head_sha }}
      HANDOFF_FILE: ${{ github.workspace }}/handoff/fleet-image-handoff.json
    steps:
      - name: Locate the triggering run's handoff artifact
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          names="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .name')"
          if printf '%s\n' "$names" | grep -Fxq "$HANDOFF_ARTIFACT"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "handoff artifact ${HANDOFF_ARTIFACT} found in ${RUN_URL}"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Stage A handoff skipped::${RUN_URL} produced no ${HANDOFF_ARTIFACT}; the publish job was skipped (no image input changed), so the previously published Fleet image remains current and there is nothing to hand off."
            exit 0
          fi

      - name: Download the handoff manifest of the published commit
        if: steps.locate.outputs.present == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleet-image-handoff-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: handoff

      - name: Bind the handoff to the published head_sha
        if: steps.locate.outputs.present == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          handoff = json.load(open(os.environ["HANDOFF_FILE"], encoding="utf-8"))
          fleet = handoff.get("fleet") if isinstance(handoff, dict) else None
          revision = (fleet or {}).get("revision")
          expected = os.environ["FLEET_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", expected or ""):
              sys.exit(f"workflow_run head_sha {expected!r} is not a commit SHA")
          if revision != expected:
              sys.exit(f"handoff fleet.revision {revision!r} != published head_sha {expected}")
          if fleet.get("source_repository") != "https://github.com/mekenthompson/hermes-fleet":
              sys.exit(f"handoff fleet.source_repository {fleet.get('source_repository')!r} is not this repository")
          print(f"handoff bound to Fleet {expected}: {fleet.get('immutable_ref')}")
          PY

      - name: Mint a release bot token scoped to hermes-fleet-private
        if: steps.locate.outputs.present == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: mekenthompson
          repositories: hermes-fleet-private

      - name: Check out the private release conductor
        if: steps.locate.outputs.present == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mekenthompson/hermes-fleet-private
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: private

      - name: Open or reuse the Stage A PR and arm auto-merge
        if: steps.locate.outputs.present == 'true'
        working-directory: private
        env:
          # The App token reaches the conductor only through gh's environment;
          # it is never written to disk or printed.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 scripts/release-conductor.py \
            --workdir "$RUNNER_TEMP/conductor" \
            --state "$RUNNER_TEMP/state.json" \
            --fleet-handoff "$HANDOFF_FILE" \
            --auto-merge \
            private-stage-a-pr
