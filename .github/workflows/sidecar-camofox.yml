name: Sidecar Camofox

on:
  pull_request:
    paths:
      - "sidecars/camofox/**"
      - ".github/workflows/sidecar-camofox.yml"
  push:
    branches: [main]
    paths:
      - "sidecars/camofox/**"
      - ".github/workflows/sidecar-camofox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidecar-camofox-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: ghcr.io/mekenthompson/hermes-fleet-camofox
  CAMOFOX_COMMIT: 771b610a7b5994759c138b912741de58b0edd588

jobs:
  test:
    if: github.repository == 'mekenthompson/hermes-fleet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Source tests
        run: python3 -m unittest tests.test_sidecar_packages -v

  bake:
    needs: test
    if: github.repository == 'mekenthompson/hermes-fleet'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Checkout Camofox browser
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: jo-inc/camofox-browser
          ref: 771b610a7b5994759c138b912741de58b0edd588
          path: camofox-browser
          persist-credentials: false
      - name: Verify lock commit
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          lock = json.loads(Path("sidecars/camofox/lock.json").read_text(encoding="utf-8"))
          got = subprocess.check_output(
              ["git", "-C", "camofox-browser", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          if got != lock["commit"]:
              raise SystemExit(f"camofox-browser HEAD {got} != lock {lock['commit']}")
          PY
      - name: Apply public patches
        run: |
          set -eux
          git -C camofox-browser apply --check ../sidecars/camofox/patches/camofox-window-1920x1080.patch
          git -C camofox-browser apply ../sidecars/camofox/patches/camofox-window-1920x1080.patch
          grep -F "window: [1920, 1080]" camofox-browser/server.js
          grep -F "screen: { minWidth: 1920, maxWidth: 1920, minHeight: 1080, maxHeight: 1080 }" camofox-browser/server.js
          git -C camofox-browser apply --check ../sidecars/camofox/patches/camofox-media-runtime.patch
          git -C camofox-browser apply ../sidecars/camofox/patches/camofox-media-runtime.patch
          grep -F "ffmpeg" camofox-browser/Dockerfile
          grep -F "fonts-noto-cjk" camofox-browser/Dockerfile
      - name: Reclaim disk for the browser bake
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af --volumes || true
          df -h
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: camofox-browser
          file: camofox-browser/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          provenance: false
          sbom: false
      - name: Attest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.push.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
