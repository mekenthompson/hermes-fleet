name: Fleet Image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact selected main commit to GHCR
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read # inspect CI for the exact selected commit; publication fails closed without it

concurrency:
  group: fleet-image-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: ghcr.io/mekenthompson/hermes-fleet-public
  TEST_IMAGE: ghcr.io/mekenthompson/hermes-fleet-public:sha-${{ github.sha }}
  ONEPASSWORD_CLI_IMAGE: docker.io/1password/op@sha256:d7d12b409ec699c9fa139d3bdfc80671f744380d39db8c539d9dc6e7e553d3c1
  CLAUDE_CODE_VERSION: "2.1.261"
  CLAUDE_AGENT_ACP_VERSION: "0.75.1"
  CLAUDE_ACP_PLUGIN_SOURCE: https://github.com/mvdbastos/hermes-acp-agents
  CLAUDE_ACP_PLUGIN_REVISION: 0526610a3945cc376ac517b63ca358a5b838a2fc

jobs:
  preflight:
    # Read-only PR and manual bakes never receive package write credentials or write a registry ref.
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      (github.repository == 'mekenthompson/hermes-fleet-public' ||
      github.repository == 'mekenthompson/hermes-fleet')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate immutable Agent handoff
        id: agent
        run: |
          set -euo pipefail
          python3 scripts/read-agent-image-manifest.py \
            --manifest release/agent-image-manifest.json \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"

      - name: Log in to GHCR to pull the pinned Agent parent
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Pull exact Agent parent
        run: |
          set -euo pipefail
          docker pull "$AGENT_IMAGE"
          docker pull "$ONEPASSWORD_CLI_IMAGE"

      - name: Build Fleet child without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            AGENT_IMAGE=${{ steps.agent.outputs.AGENT_IMAGE }}
            ONEPASSWORD_CLI_IMAGE=${{ env.ONEPASSWORD_CLI_IMAGE }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            CLAUDE_AGENT_ACP_VERSION=${{ env.CLAUDE_AGENT_ACP_VERSION }}
            CLAUDE_ACP_PLUGIN_SOURCE=${{ env.CLAUDE_ACP_PLUGIN_SOURCE }}
            CLAUDE_ACP_PLUGIN_REVISION=${{ env.CLAUDE_ACP_PLUGIN_REVISION }}
            FLEET_GIT_SHA=${{ github.sha }}
            FLEET_IMAGE_IDENTITY=${{ env.IMAGE_REPOSITORY }}
          cache-from: type=gha,scope=fleet-public-amd64
          cache-to: type=gha,mode=max,scope=fleet-public-amd64

      - name: Verify inherited runtime and provenance
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_IMAGE_IDENTITY: ${{ env.IMAGE_REPOSITORY }}
          EXPECTED_AGENT_IMAGE: ${{ env.AGENT_IMAGE }}
          EXPECTED_AGENT_REPOSITORY: ${{ env.AGENT_REPOSITORY }}
          EXPECTED_AGENT_REVISION: ${{ env.AGENT_REVISION }}
          EXPECTED_ONEPASSWORD_CLI_IMAGE: ${{ env.ONEPASSWORD_CLI_IMAGE }}
          EXPECTED_CLAUDE_CODE_VERSION: ${{ env.CLAUDE_CODE_VERSION }}
          EXPECTED_CLAUDE_AGENT_ACP_VERSION: ${{ env.CLAUDE_AGENT_ACP_VERSION }}
          EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE: ${{ env.CLAUDE_ACP_PLUGIN_SOURCE }}
          EXPECTED_CLAUDE_ACP_PLUGIN_REVISION: ${{ env.CLAUDE_ACP_PLUGIN_REVISION }}
        run: |
          set -euo pipefail
          python3 scripts/verify-inherited-runtime-config.py
          docker run --rm \
            --env EXPECTED_REVISION \
            --env EXPECTED_IMAGE_IDENTITY \
            --env EXPECTED_AGENT_IMAGE \
            --env EXPECTED_AGENT_REPOSITORY \
            --env EXPECTED_AGENT_REVISION \
            --env EXPECTED_ONEPASSWORD_CLI_IMAGE \
            --env EXPECTED_CLAUDE_CODE_VERSION \
            --env EXPECTED_CLAUDE_AGENT_ACP_VERSION \
            --env EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE \
            --env EXPECTED_CLAUDE_ACP_PLUGIN_REVISION \
            --entrypoint python3 "$TEST_IMAGE" -c '
          import importlib.metadata as metadata
          import importlib.util
          import json, os, pathlib, pwd, shutil, subprocess, sys
          marker = json.loads(pathlib.Path("/etc/hermes/image-provenance.json").read_text(encoding="utf-8"))
          fleet = json.loads(pathlib.Path("/etc/hermes-fleet/image-provenance.json").read_text(encoding="utf-8"))
          assert marker["revision"] == os.environ["EXPECTED_AGENT_REVISION"], marker
          assert marker["image"] == os.environ["EXPECTED_AGENT_REPOSITORY"], marker
          assert marker["version"] == metadata.version("hermes-agent"), marker
          assert fleet["revision"] == os.environ["EXPECTED_REVISION"], fleet
          assert fleet["image"] == os.environ["EXPECTED_IMAGE_IDENTITY"], fleet
          assert fleet["parent_agent_image"] == os.environ["EXPECTED_AGENT_IMAGE"], fleet
          assert fleet["onepassword_cli_image"] == os.environ["EXPECTED_ONEPASSWORD_CLI_IMAGE"], fleet
          assert fleet["claude_code_version"] == os.environ["EXPECTED_CLAUDE_CODE_VERSION"], fleet
          assert fleet["claude_agent_acp_version"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"], fleet
          assert fleet["claude_acp_plugin_source"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE"], fleet
          assert fleet["claude_acp_plugin_revision"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_REVISION"], fleet
          assert os.environ["HERMES_FLEET_GIT_SHA"] == os.environ["EXPECTED_REVISION"]
          assert os.environ["HERMES_FLEET_IMAGE_IDENTITY"] == os.environ["EXPECTED_IMAGE_IDENTITY"]
          assert os.environ["HERMES_FLEET_AGENT_IMAGE"] == os.environ["EXPECTED_AGENT_IMAGE"]
          assert os.environ["HERMES_FLEET_ONEPASSWORD_CLI_IMAGE"] == os.environ["EXPECTED_ONEPASSWORD_CLI_IMAGE"]
          assert os.environ["HERMES_FLEET_CLAUDE_CODE_VERSION"] == os.environ["EXPECTED_CLAUDE_CODE_VERSION"]
          assert os.environ["HERMES_FLEET_CLAUDE_AGENT_ACP_VERSION"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"]
          assert os.environ["HERMES_FLEET_CLAUDE_ACP_PLUGIN_SOURCE"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE"]
          assert os.environ["HERMES_FLEET_CLAUDE_ACP_PLUGIN_REVISION"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_REVISION"]
          assert subprocess.check_output(["/usr/local/bin/op", "--version"], text=True).strip() == "2.39.0"
          assert subprocess.check_output(["/usr/local/bin/claude", "--version"], text=True).strip() == os.environ["EXPECTED_CLAUDE_CODE_VERSION"] + " (Claude Code)"
          adapter = json.loads(pathlib.Path("/opt/coding-clis/node_modules/@agentclientprotocol/claude-agent-acp/package.json").read_text(encoding="utf-8"))
          assert adapter["version"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"], adapter
          assert pathlib.Path("/usr/local/bin/claude-agent-acp").is_file()
          assert pathlib.Path("/opt/hermes/plugins/model-providers/claude-acp/__init__.py").is_file()
          linear_plugin = pathlib.Path("/opt/hermes/plugins/linear-agent")
          assert (linear_plugin / "__init__.py").is_file()
          assert (linear_plugin / "linear_runtime.py").is_file()
          assert not (linear_plugin / "linear-agents.json").exists()
          from hermes_cli.plugins import PluginContext
          assert callable(PluginContext.register_profile_service)
          spec = importlib.util.spec_from_file_location(
              "hermes_plugins.linear_agent_release",
              linear_plugin / "__init__.py",
              submodule_search_locations=[str(linear_plugin)],
          )
          assert spec is not None and spec.loader is not None
          linear_module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = linear_module
          spec.loader.exec_module(linear_module)
          assert callable(linear_module.register)
          perplexity_plugin = pathlib.Path("/opt/hermes/plugins/web/perplexity")
          assert pathlib.Path("/opt/hermes/plugins/web/perplexity/provider.py").is_file()
          perplexity_spec = importlib.util.spec_from_file_location(
              "hermes_plugins.web.perplexity_release",
              perplexity_plugin / "__init__.py",
              submodule_search_locations=[str(perplexity_plugin)],
          )
          assert perplexity_spec is not None and perplexity_spec.loader is not None
          perplexity_module = importlib.util.module_from_spec(perplexity_spec)
          sys.modules[perplexity_spec.name] = perplexity_module
          perplexity_spec.loader.exec_module(perplexity_module)
          perplexity = perplexity_module.PerplexityWebSearchProvider()
          assert perplexity.name == "perplexity"
          assert perplexity.supports_search() and not perplexity.supports_extract()
          assert not perplexity.is_available()
          from providers import get_provider_profile
          from hermes_cli.auth import resolve_external_process_provider_credentials
          profile = get_provider_profile("claude-acp")
          assert profile is not None and profile.base_url == "acp://claude", profile
          creds = resolve_external_process_provider_credentials("claude-acp")
          assert creds["command"] == "/usr/local/bin/hermes-claude-acp-subscription", creds
          assert creds["args"] == [], creds
          assert shutil.which(creds["command"]) == creds["command"]
          client = profile.create_client(api_key=creds["api_key"], base_url=creds["base_url"])
          assert client is not None
          assert pwd.getpwnam("hermes").pw_uid != 0
          assert not pathlib.Path("/var/run/docker.sock").exists()
          assert pathlib.Path("/opt/hermes-fleet/contracts/image.json").is_file()
          '
          docker run --rm --network none "$TEST_IMAGE" python3 -c 'import os; assert os.getuid() != 0'
          docker run --rm --entrypoint hermes "$TEST_IMAGE" --version

      - name: Generate full image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.TEST_IMAGE }}
          format: spdx-json
          output-file: fleet-image.spdx.json
          upload-artifact: false

      - name: Create bounded package SBOM for attestation
        run: |
          set -euo pipefail
          python3 scripts/compact-spdx-sbom.py \
            --input fleet-image.spdx.json \
            --output fleet-image.attestation.spdx.json \
            --max-bytes 16777216

      - name: Set up Python for SPDX schema validation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install pinned SPDX schema validator
        run: |
          set -euo pipefail
          python3 -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement release/spdx-validation-requirements.txt

      - name: Validate full and compact SPDX 2.3 documents
        run: |
          set -euo pipefail
          python3 scripts/validate-spdx-schema.py \
            --schema release/spdx-2.3-schema.json \
            fleet-image.spdx.json \
            fleet-image.attestation.spdx.json

      - name: Scan critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: json
          output: trivy-image.json
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Enforce critical findings and scoped VEX policy
        run: |
          set -euo pipefail
          docker run --rm --entrypoint cat "$TEST_IMAGE" /usr/local/bin/op > op-vex.bin
          test -s op-vex.bin
          python3 scripts/verify-trivy-vex.py \
            --trivy trivy-image.json \
            --policy release/vex-exceptions.json \
            --binary op-vex.bin \
            --component-image "$ONEPASSWORD_CLI_IMAGE" \
            --output vex-evaluation.json


      - name: Upload pre-publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleet-image-evidence-${{ github.sha }}
          path: |
            fleet-image.spdx.json
            fleet-image.attestation.spdx.json
            trivy-image.json
            vex-evaluation.json
            release/vex-exceptions.json
          if-no-files-found: error
          retention-days: 30

  publish:
    if: >-
      (github.repository == 'mekenthompson/hermes-fleet-public' ||
      github.repository == 'mekenthompson/hermes-fleet') &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: fleet-image-publish
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify exact main CI gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify-exact-main-ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "ci.yml" \
            --sha "$GITHUB_SHA" \
            --workflow-path ".github/workflows/ci.yml"

      - name: Revalidate immutable Agent handoff
        run: |
          set -euo pipefail
          python3 scripts/read-agent-image-manifest.py \
            --manifest release/agent-image-manifest.json \
            --github-env "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and scan exact publish candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            AGENT_IMAGE=${{ env.AGENT_IMAGE }}
            ONEPASSWORD_CLI_IMAGE=${{ env.ONEPASSWORD_CLI_IMAGE }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            CLAUDE_AGENT_ACP_VERSION=${{ env.CLAUDE_AGENT_ACP_VERSION }}
            CLAUDE_ACP_PLUGIN_SOURCE=${{ env.CLAUDE_ACP_PLUGIN_SOURCE }}
            CLAUDE_ACP_PLUGIN_REVISION=${{ env.CLAUDE_ACP_PLUGIN_REVISION }}
            FLEET_GIT_SHA=${{ github.sha }}
            FLEET_IMAGE_IDENTITY=${{ env.IMAGE_REPOSITORY }}
          cache-from: type=gha,scope=fleet-public-amd64
          cache-to: type=gha,mode=max,scope=fleet-public-amd64

      - name: Verify exact scanned candidate runtime and provenance
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_IMAGE_IDENTITY: ${{ env.IMAGE_REPOSITORY }}
          EXPECTED_AGENT_IMAGE: ${{ env.AGENT_IMAGE }}
          EXPECTED_AGENT_REPOSITORY: ${{ env.AGENT_REPOSITORY }}
          EXPECTED_AGENT_REVISION: ${{ env.AGENT_REVISION }}
          EXPECTED_ONEPASSWORD_CLI_IMAGE: ${{ env.ONEPASSWORD_CLI_IMAGE }}
          EXPECTED_CLAUDE_CODE_VERSION: ${{ env.CLAUDE_CODE_VERSION }}
          EXPECTED_CLAUDE_AGENT_ACP_VERSION: ${{ env.CLAUDE_AGENT_ACP_VERSION }}
          EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE: ${{ env.CLAUDE_ACP_PLUGIN_SOURCE }}
          EXPECTED_CLAUDE_ACP_PLUGIN_REVISION: ${{ env.CLAUDE_ACP_PLUGIN_REVISION }}
        run: |
          set -euo pipefail
          docker pull "$AGENT_IMAGE"
          python3 scripts/verify-inherited-runtime-config.py
          docker run --rm \
            --env EXPECTED_REVISION \
            --env EXPECTED_IMAGE_IDENTITY \
            --env EXPECTED_AGENT_IMAGE \
            --env EXPECTED_AGENT_REPOSITORY \
            --env EXPECTED_AGENT_REVISION \
            --env EXPECTED_ONEPASSWORD_CLI_IMAGE \
            --env EXPECTED_CLAUDE_CODE_VERSION \
            --env EXPECTED_CLAUDE_AGENT_ACP_VERSION \
            --env EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE \
            --env EXPECTED_CLAUDE_ACP_PLUGIN_REVISION \
            --entrypoint python3 "$TEST_IMAGE" -c '
          import importlib.metadata as metadata
          import importlib.util
          import json, os, pathlib, pwd, shutil, subprocess, sys
          marker = json.loads(pathlib.Path("/etc/hermes/image-provenance.json").read_text(encoding="utf-8"))
          fleet = json.loads(pathlib.Path("/etc/hermes-fleet/image-provenance.json").read_text(encoding="utf-8"))
          assert marker["revision"] == os.environ["EXPECTED_AGENT_REVISION"], marker
          assert marker["image"] == os.environ["EXPECTED_AGENT_REPOSITORY"], marker
          assert marker["version"] == metadata.version("hermes-agent"), marker
          assert fleet["revision"] == os.environ["EXPECTED_REVISION"], fleet
          assert fleet["image"] == os.environ["EXPECTED_IMAGE_IDENTITY"], fleet
          assert fleet["parent_agent_image"] == os.environ["EXPECTED_AGENT_IMAGE"], fleet
          assert fleet["onepassword_cli_image"] == os.environ["EXPECTED_ONEPASSWORD_CLI_IMAGE"], fleet
          assert fleet["claude_code_version"] == os.environ["EXPECTED_CLAUDE_CODE_VERSION"], fleet
          assert fleet["claude_agent_acp_version"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"], fleet
          assert fleet["claude_acp_plugin_source"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE"], fleet
          assert fleet["claude_acp_plugin_revision"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_REVISION"], fleet
          assert os.environ["HERMES_FLEET_GIT_SHA"] == os.environ["EXPECTED_REVISION"]
          assert os.environ["HERMES_FLEET_IMAGE_IDENTITY"] == os.environ["EXPECTED_IMAGE_IDENTITY"]
          assert os.environ["HERMES_FLEET_AGENT_IMAGE"] == os.environ["EXPECTED_AGENT_IMAGE"]
          assert os.environ["HERMES_FLEET_ONEPASSWORD_CLI_IMAGE"] == os.environ["EXPECTED_ONEPASSWORD_CLI_IMAGE"]
          assert os.environ["HERMES_FLEET_CLAUDE_CODE_VERSION"] == os.environ["EXPECTED_CLAUDE_CODE_VERSION"]
          assert os.environ["HERMES_FLEET_CLAUDE_AGENT_ACP_VERSION"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"]
          assert os.environ["HERMES_FLEET_CLAUDE_ACP_PLUGIN_SOURCE"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE"]
          assert os.environ["HERMES_FLEET_CLAUDE_ACP_PLUGIN_REVISION"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_REVISION"]
          assert subprocess.check_output(["/usr/local/bin/op", "--version"], text=True).strip() == "2.39.0"
          assert subprocess.check_output(["/usr/local/bin/claude", "--version"], text=True).strip() == os.environ["EXPECTED_CLAUDE_CODE_VERSION"] + " (Claude Code)"
          adapter = json.loads(pathlib.Path("/opt/coding-clis/node_modules/@agentclientprotocol/claude-agent-acp/package.json").read_text(encoding="utf-8"))
          assert adapter["version"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"], adapter
          assert pathlib.Path("/usr/local/bin/claude-agent-acp").is_file()
          assert pathlib.Path("/opt/hermes/plugins/model-providers/claude-acp/__init__.py").is_file()
          linear_plugin = pathlib.Path("/opt/hermes/plugins/linear-agent")
          assert (linear_plugin / "__init__.py").is_file()
          assert (linear_plugin / "linear_runtime.py").is_file()
          assert not (linear_plugin / "linear-agents.json").exists()
          from hermes_cli.plugins import PluginContext
          assert callable(PluginContext.register_profile_service)
          spec = importlib.util.spec_from_file_location(
              "hermes_plugins.linear_agent_release",
              linear_plugin / "__init__.py",
              submodule_search_locations=[str(linear_plugin)],
          )
          assert spec is not None and spec.loader is not None
          linear_module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = linear_module
          spec.loader.exec_module(linear_module)
          assert callable(linear_module.register)
          perplexity_plugin = pathlib.Path("/opt/hermes/plugins/web/perplexity")
          assert pathlib.Path("/opt/hermes/plugins/web/perplexity/provider.py").is_file()
          perplexity_spec = importlib.util.spec_from_file_location(
              "hermes_plugins.web.perplexity_release",
              perplexity_plugin / "__init__.py",
              submodule_search_locations=[str(perplexity_plugin)],
          )
          assert perplexity_spec is not None and perplexity_spec.loader is not None
          perplexity_module = importlib.util.module_from_spec(perplexity_spec)
          sys.modules[perplexity_spec.name] = perplexity_module
          perplexity_spec.loader.exec_module(perplexity_module)
          perplexity = perplexity_module.PerplexityWebSearchProvider()
          assert perplexity.name == "perplexity"
          assert perplexity.supports_search() and not perplexity.supports_extract()
          assert not perplexity.is_available()
          from providers import get_provider_profile
          from hermes_cli.auth import resolve_external_process_provider_credentials
          profile = get_provider_profile("claude-acp")
          assert profile is not None and profile.base_url == "acp://claude", profile
          creds = resolve_external_process_provider_credentials("claude-acp")
          assert creds["command"] == "/usr/local/bin/hermes-claude-acp-subscription", creds
          assert creds["args"] == [], creds
          assert shutil.which(creds["command"]) == creds["command"]
          client = profile.create_client(api_key=creds["api_key"], base_url=creds["base_url"])
          assert client is not None
          assert pwd.getpwnam("hermes").pw_uid != 0
          assert not pathlib.Path("/var/run/docker.sock").exists()
          '
          docker run --rm --network none "$TEST_IMAGE" python3 -c 'import os; assert os.getuid() != 0'
          docker run --rm --entrypoint hermes "$TEST_IMAGE" --version

      - name: Generate full image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.TEST_IMAGE }}
          format: spdx-json
          output-file: fleet-image.spdx.json
          upload-artifact: false

      - name: Set up Python for SPDX schema validation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Create and validate bounded attestation SBOM
        run: |
          set -euo pipefail
          python3 scripts/compact-spdx-sbom.py \
            --input fleet-image.spdx.json \
            --output fleet-image.attestation.spdx.json \
            --max-bytes 16777216
          python3 -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement release/spdx-validation-requirements.txt
          python3 scripts/validate-spdx-schema.py \
            --schema release/spdx-2.3-schema.json \
            fleet-image.spdx.json \
            fleet-image.attestation.spdx.json

      - name: Scan critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          format: json
          output: trivy-image.json
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Revalidate scoped VEX decision before publication
        run: |
          set -euo pipefail
          docker run --rm --entrypoint cat "$TEST_IMAGE" /usr/local/bin/op > op-vex-publish.bin
          test -s op-vex-publish.bin
          python3 scripts/verify-trivy-vex.py \
            --trivy trivy-image.json \
            --policy release/vex-exceptions.json \
            --binary op-vex-publish.bin \
            --component-image "$ONEPASSWORD_CLI_IMAGE" \
            --output vex-publish-evaluation.json

      - name: Push unique staging candidate and capture pushed digest
        id: publish
        env:
          STAGING_IMAGE: ${{ env.IMAGE_REPOSITORY }}:fleet-stage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker tag "$TEST_IMAGE" "$STAGING_IMAGE"
          push_output=$(docker push "$STAGING_IMAGE")
          printf '%s\n' "$push_output"
          digest=$(printf '%s\n' "$push_output" | python3 scripts/extract-pushed-image-digest.py)
          test -n "$digest"
          immutable_ref="$IMAGE_REPOSITORY@$digest"
          local_config_digest=$(docker image inspect --format '{{.Id}}' "$TEST_IMAGE")
          test -n "$local_config_digest"
          printf 'digest=%s\nimmutable_ref=%s\nlocal-config-digest=%s\nstaging-image=%s\n' \
            "$digest" "$immutable_ref" "$local_config_digest" "$STAGING_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Verify remote immutable manifest identity
        env:
          IMMUTABLE_REF: ${{ steps.publish.outputs.immutable_ref }}
          LOCAL_CONFIG_DIGEST: ${{ steps.publish.outputs.local-config-digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMMUTABLE_REF" > remote-manifest.json
          remote_config_digest=$(python3 -c '
          import json
          manifest = json.load(open("remote-manifest.json", encoding="utf-8"))
          digest = manifest.get("config", {}).get("digest")
          assert isinstance(digest, str) and digest.startswith("sha256:"), manifest
          print(digest)
          ')
          test -n "$remote_config_digest"
          test "$remote_config_digest" = "$LOCAL_CONFIG_DIGEST" || {
            printf '%s\n' 'remote manifest config does not match scanned candidate' >&2
            exit 1
          }
          printf 'remote-config-digest=%s\n' "$remote_config_digest" >> "$GITHUB_OUTPUT"

      - name: Promote immutable staging digest
        env:
          IMMUTABLE_REF: ${{ steps.publish.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE_REPOSITORY:sha-${{ github.sha }}" \
            "$IMMUTABLE_REF"

      - name: Verify promoted SHA tag resolves to staged digest
        env:
          SHA_TAG: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          STAGED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          promoted_digest=$(docker buildx imagetools inspect --format '{{.Digest}}' "$SHA_TAG")
          test -n "$promoted_digest"
          test "$promoted_digest" = "$STAGED_DIGEST" || {
            printf '%s\n' 'promoted SHA tag does not resolve to staged digest' >&2
            exit 1
          }

      - name: Emit exact Fleet handoff manifest
        run: |
          set -euo pipefail
          python3 scripts/emit-fleet-image-manifest.py \
            --repository "$IMAGE_REPOSITORY" \
            --revision "${{ github.sha }}" \
            --digest "${{ steps.publish.outputs.digest }}" \
            --agent-manifest release/agent-image-manifest.json \
            --output fleet-image-handoff.json

      - name: Attest published digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest published SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: fleet-image.attestation.spdx.json
          push-to-registry: true

      - name: Upload private House handoff manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleet-image-handoff-${{ github.sha }}
          path: fleet-image-handoff.json
          if-no-files-found: error
          retention-days: 90
